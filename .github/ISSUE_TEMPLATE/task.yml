name: 📝 Task
description: Internal task or maintenance work
labels: ["task"]
body:
  - type: textarea
    id: description
    attributes:
      label: Task description
      description: Explain clearly what needs to be done and why.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps / action items
      value: |
        - [ ] Step 1
        - [ ] Step 2
        - [ ] Step 3

  - type: textarea
    id: goal
    attributes:
      label: Goal / expected outcome
      description: What should the result look like once the task is completed?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      multiple: true
      options:
        - Frontend
        - Backend
        - API
        - Database
        - CI/CD
        - Documentation
        - Other

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Low
        - Medium
        - High
    validations:
      required: true

  - type: textarea
    id: related
    attributes:
      label: Related issues / PRs

  - type: textarea
    id: notes
    attributes:
      label: Additional notes
