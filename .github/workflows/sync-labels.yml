name: Reusable Sync Labels

on:
  workflow_call:

permissions:
  issues: write
  contents: read

jobs:
  sync-labels:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout org defaults
        uses: actions/checkout@v4
        with:
          repository: TriNodes/.github
          path: org-defaults

      - name: Validate labels.json exists
        run: |
          if [ ! -f org-defaults/labels.json ]; then
            echo "::error::labels.json não encontrado no repositório TriNodes/.github"
            exit 1
          fi

      - name: Load labels from org defaults
        id: load
        run: |
          jq -c '.[]' org-defaults/labels.json > labels.txt

      - name: Apply labels (sync + update)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          while read -r row; do
            name=$(echo "$row" | jq -r '.name')
            color=$(echo "$row" | jq -r '.color')
            desc=$(echo "$row" | jq -r '.description')

            # Validação mínima
            if [ -z "$name" ]; then
              echo "::warning::Label sem nome ignorado"
              continue
            fi

            if [ -z "$color" ]; then
              echo "::warning::Label $name sem cor — usando cor padrão"
              color="cccccc"
            fi

            if [ -z "$desc" ]; then
              echo "::warning::Label $name sem descrição — adicionando descrição padrão"
              desc="Label sincronizado automaticamente"
            fi

            # Cria ou atualiza
            gh label create "$name" \
              --color "$color" \
              --description "$desc" \
              --force || true
          done < labels.txt

      - name: Detect orphan labels (labels que existem no repo mas não no labels.json)
        id: orphan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label list --json name --jq '.[].name' > existing.txt
          jq -r '.[].name' org-defaults/labels.json > expected.txt

          comm -23 <(sort existing.txt) <(sort expected.txt) > orphan.txt

          if [ -s orphan.txt ]; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Create issue for orphan labels
        if: steps.orphan.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="## Labels órfãos encontrados\n\nOs seguintes labels existem no repositório mas não no labels.json:\n\n"
          while read -r label; do
            body+="- $label\n"
          done < orphan.txt

          gh issue create \
            --title "⚠ Labels órfãos encontrados" \
            --body "$body" \
            --label "governance"
