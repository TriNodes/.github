name: Sync labels

# Keeps this repository's labels in line with the organization catalogue (labels.json)
# and opens one issue if it has labels that are not in it.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Mondays at 06:00 UTC

permissions:
  contents: read
  issues: write

jobs:
  labels:
    uses: ./.github/workflows/sync-labels.yml
