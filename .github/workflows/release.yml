name: Reusable Release

# Faz o bump da versão e empurra a tag, a partir do repositório que o chama.
#
# Duas coisas que este workflow *não* pode resolver sozinho:
#
# 1. `contents: write` tem de vir de quem chama. Um workflow chamado nunca
#    recebe mais permissões do que o GITHUB_TOKEN do chamador já tem, e o
#    predefinido da organização é só leitura. Quem chama precisa de:
#
#      jobs:
#        release:
#          permissions:
#            contents: write
#          uses: TriNodes/.github/.github/workflows/release.yml@main
#
# 2. O repositório que chama precisa de `package.json` e `package-lock.json`,
#    senão o `npm ci` não tem o que instalar.

on:
  workflow_call:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm version` faz um commit, e um commit precisa de autor. Os runners
      # do GitHub não trazem identidade git configurada, por isso sem isto o
      # passo abaixo morria com "Author identity unknown" — depois de o
      # problema das permissões estar resolvido, que era o que o escondia.
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # `git push --follow-tags` manda o commit e a tag num único push. Se o
      # branch tiver avançado entretanto (ex: um PR fez merge enquanto este
      # job corria), o push do commit é rejeitado mas o da tag pode passar
      # na mesma — fica uma tag órfã, e todas as corridas seguintes tentam
      # recriar a mesma versão e chocam com essa tag ("tag already exists").
      # Por isso aqui separamos os dois: o bump de versão só mexe no working
      # tree (--no-git-tag-version), fazemos o commit à mão, tentamos o push
      # do branch com rebase-and-retry, e só criamos e empurramos a tag
      # depois de o commit estar confirmado no branch remoto.
      - name: Version bump
        run: |
          set -e
          npm version patch --no-git-tag-version
          new_version=$(node -p "require('./package.json').version")
          git commit -am "chore: bump version to ${new_version} [skip ci]"

          attempt=1
          max_attempts=3
          until git push; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::push do commit de bump falhou depois de ${max_attempts} tentativas"
              exit 1
            fi
            attempt=$((attempt + 1))
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
          done

          git tag -a "v${new_version}" -m "v${new_version}"
          git push origin "v${new_version}"
