name: Reusable Release

# Bumps the version, pushes the tag and publishes a GitHub Release from the
# repository that calls it.
#
# Things this workflow cannot solve on its own:
#
# 1. `contents: write` has to come from the caller. A called workflow never
#    gets more permissions than the caller's GITHUB_TOKEN already has, and the
#    organization default is read-only. The caller needs:
#
#      jobs:
#        release:
#          permissions:
#            contents: write
#          uses: TriNodes/.github/.github/workflows/release.yml@main
#          with:
#            bump: minor   # patch (default) | minor | major
#
# 2. The calling repository needs `package.json` and `package-lock.json`,
#    otherwise `npm ci` has nothing to install.
#
# 3. If `main` is protected and requires pull requests, the default
#    GITHUB_TOKEN cannot push the version commit. Allow the bot to bypass the
#    rule, or use a GitHub App token.

on:
  workflow_call:
    inputs:
      bump:
        description: Version increment to apply (patch, minor or major)
        type: string
        default: patch
      node_version:
        description: Node.js version
        type: string
        default: "22"

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Two merges in quick succession start two releases that compute the same next
    # version and race to push the same commit and tag ("tag already exists").
    # Run them one at a time per repository; a waiting run is replaced by the newest
    # one, which bumps from the latest main anyway.
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - name: Validate inputs
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          case "$BUMP" in
            patch|minor|major) ;;
            *) echo "::error::bump must be patch, minor or major (got '$BUMP')"; exit 1 ;;
          esac

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm version` makes a commit and a commit needs an author. GitHub runners
      # have no git identity configured, so without this the bump step fails with
      # "Author identity unknown".
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # `git push --follow-tags` sends the commit and the tag in a single push. If
      # the branch moved in the meantime (for example a PR merged while this job
      # was running) the commit push is rejected but the tag push can still go
      # through, leaving an orphan tag that makes every following run try to
      # recreate the same version and collide with it ("tag already exists").
      # So the two are separated: the bump only touches the working tree
      # (--no-git-tag-version), the commit is made by hand, the branch push is
      # retried with rebase, and the tag is only created and pushed once the
      # commit is confirmed on the remote branch.
      - name: Version bump
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -e
          npm version "$BUMP" --no-git-tag-version
          new_version=$(node -p "require('./package.json').version")
          git commit -am "chore: bump version to ${new_version} [skip ci]"

          attempt=1
          max_attempts=3
          until git push; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::pushing the bump commit failed after ${max_attempts} attempts"
              exit 1
            fi
            attempt=$((attempt + 1))
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
          done

          git tag -a "v${new_version}" -m "v${new_version}"
          git push origin "v${new_version}"
          echo "version=${new_version}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          gh release create "v${VERSION}" --verify-tag --title "v${VERSION}" --generate-notes
