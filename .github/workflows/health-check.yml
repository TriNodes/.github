name: Organization Health Check

on:
  schedule:
    - cron: "0 9 * * MON" # Every Monday at 09:00
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}
      ORG: TriNodes
      REPORT_REPO: TriNodes/.health-reports

    steps:
      - name: Prepare report file
        run: echo "# Weekly Organization Health Report" > report.md

      - name: Fetch organization repositories
        run: |
          echo "Fetching repositories..."
          gh repo list $ORG --limit 200 --json name --jq '.[].name' > repos.txt

      - name: Check repositories
        run: |
          echo "Starting checks..."
          while read repo; do
            echo "## $repo" >> report.md
            echo "- Checking $repo..."

            # Check .github folder
            if gh api repos/$ORG/$repo/contents/.github --silent >/dev/null 2>&1; then
              echo "- ✔ .github folder found" >> report.md
            else
              echo "- ❌ Missing .github folder" >> report.md
            fi

            # Check workflows
            if gh api repos/$ORG/$repo/contents/.github/workflows --silent >/dev/null 2>&1; then
              echo "- ✔ Workflows found" >> report.md
            else
              echo "- ❌ Missing workflows" >> report.md
            fi

            # Check CODEOWNERS
            if gh api repos/$ORG/$repo/contents/.github/CODEOWNERS --silent >/dev/null 2>&1; then
              echo "- ✔ CODEOWNERS found" >> report.md
            else
              echo "- ❌ Missing CODEOWNERS" >> report.md
            fi

            # Check issue templates
            if gh api repos/$ORG/$repo/contents/.github/ISSUE_TEMPLATE --silent >/dev/null 2>&1; then
              echo "- ✔ Issue templates found" >> report.md
            else
              echo "- ❌ Missing issue templates" >> report.md
            fi

            # Check PR templates
            if gh api repos/$ORG/$repo/contents/.github/pull_request_template.md --silent >/dev/null 2>&1; then
              echo "- ✔ Pull request template found" >> report.md
            else
              echo "- ❌ Missing pull request template" >> report.md
            fi

            # Check Dependabot
            if gh api repos/$ORG/$repo/contents/.github/dependabot.yml --silent >/dev/null 2>&1; then
              echo "- ✔ Dependabot found" >> report.md
            else
              echo "- ❌ Missing Dependabot" >> report.md
            fi

            # Check branch protection
            if gh api repos/$ORG/$repo/branches/main/protection --silent >/dev/null 2>&1; then
              echo "- ✔ Branch protection enabled" >> report.md
            else
              echo "- ❌ Missing branch protection" >> report.md
            fi

            echo "" >> report.md
          done < repos.txt

      - name: Create or update health report issue
        run: |
          echo "Publishing report..."
          gh issue create \
            --repo $REPORT_REPO \
            --title "Weekly Organization Health Report" \
            --body-file report.md \
            --label "health-check" \
            || echo "Issue already exists or could not be created"
