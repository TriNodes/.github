name: Organization Health Check

# Weekly audit of the repositories in the organization.
#
# This repository is PUBLIC, and so are its issues and job summaries. The report
# therefore never includes private repositories unless it can be published to a
# private repository:
#
#   Default mode ............ audits PUBLIC repositories only. The report goes to the
#                             job summary and to one open `health-check` issue here.
#
#   Private mode (opt-in) ... audits ALL repositories. Requires BOTH
#                               - secret   ORG_AUDIT_TOKEN: fine-grained token (or GitHub App
#                                 token) with read access to Contents, Metadata and
#                                 Administration, plus write access to Issues on the report repo
#                               - variable HEALTH_REPORT_REPO: a PRIVATE repository (owner/name)
#                                 where the report issue is kept
#                             Nothing is written to the (public) job summary in this mode.

on:
  schedule:
    - cron: "0 9 * * 1" # Every Monday at 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health-check:
    name: Audit repositories
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ORG: ${{ github.repository_owner }}
      AUDIT_TOKEN: ${{ secrets.ORG_AUDIT_TOKEN }}
      REPORT_REPO: ${{ vars.HEALTH_REPORT_REPO }}

    steps:
      - name: Build report
        env:
          DEFAULT_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail

          private_mode=false
          if [ -n "$AUDIT_TOKEN" ] && [ -n "$REPORT_REPO" ]; then
            private_mode=true
          fi
          echo "PRIVATE_MODE=$private_mode" >> "$GITHUB_ENV"

          if [ -n "$AUDIT_TOKEN" ]; then
            export GH_TOKEN="$AUDIT_TOKEN"
          else
            export GH_TOKEN="$DEFAULT_TOKEN"
          fi

          visibility_flag=()
          if [ "$private_mode" = "false" ]; then
            visibility_flag=(--visibility public)
          fi

          {
            echo "# Weekly Organization Health Report"
            echo
            echo "_Generated on $(date -u +%F) for \`$ORG\`._"
            echo
            if [ "$private_mode" = "false" ]; then
              echo "> ℹ️ Public repositories only. See the header of \`health-check.yml\` to audit private repositories as well."
              echo
            fi
            if [ -z "$AUDIT_TOKEN" ]; then
              echo "> ⚠️ \`ORG_AUDIT_TOKEN\` is not configured, so branch protection could not be read."
              echo
            fi
            echo "| Repository | Visibility | CODEOWNERS | Workflows | Dependabot | Branch protection |"
            echo "|---|---|:-:|:-:|:-:|:-:|"
          } > report.md

          mark() { if [ "$1" = "yes" ]; then echo "✅"; elif [ "$1" = "n/a" ]; then echo "➖"; else echo "❌"; fi; }

          gh repo list "$ORG" --limit 200 --no-archived --source "${visibility_flag[@]}" \
            --json name,visibility,defaultBranchRef \
            --jq '.[] | select(.name != ".github") | [.name, .visibility, (.defaultBranchRef.name // "")] | @tsv' > repos.tsv

          problems=0
          while IFS=$'\t' read -r name visibility branch; do
            tree=$(gh api "repos/$ORG/$name/git/trees/HEAD?recursive=1" --jq '.tree[].path' 2>/dev/null || true)

            has() { grep -Eq "$1" <<< "$tree" && echo yes || echo no; }
            codeowners=$(has '^(CODEOWNERS|\.github/CODEOWNERS|docs/CODEOWNERS)$')
            workflows=$(has '^\.github/workflows/.+\.ya?ml$')
            dependabot=$(has '^\.github/dependabot\.ya?ml$')

            protection=no
            if [ -z "$AUDIT_TOKEN" ]; then
              protection=n/a
            elif [ -n "$branch" ]; then
              if err=$(gh api "repos/$ORG/$name/branches/$branch/protection" 2>&1 > /dev/null); then
                protection=yes
              elif grep -q "Upgrade to GitHub Pro" <<< "$err"; then
                # The plan does not offer branch protection for this repository: not a gap we can close.
                protection=n/a
              elif [ "$(gh api "repos/$ORG/$name/rules/branches/$branch" --jq 'length' 2>/dev/null || echo 0)" -gt 0 ]; then
                protection=yes
              fi
            fi

            for v in "$codeowners" "$workflows" "$dependabot" "$protection"; do
              [ "$v" = "no" ] && problems=$((problems + 1))
            done

            echo "| \`$name\` | $visibility | $(mark "$codeowners") | $(mark "$workflows") | $(mark "$dependabot") | $(mark "$protection") |" >> report.md
          done < repos.tsv

          if [ ! -s repos.tsv ]; then
            echo "| _none_ | | | | | |" >> report.md
          fi

          {
            echo
            echo "**Open gaps:** $problems"
            echo
            echo "➖ = not applicable (for example branch protection is not offered by the GitHub plan for private repositories)."
            echo
            echo "_Issue templates, the pull request template, the Code of Conduct, Security Policy and Support guide are inherited from \`$ORG/.github\`, so they are not checked per repository._"
          } >> report.md

          # The job summary of a public repository is public: only write it in default mode.
          if [ "$private_mode" = "false" ]; then
            cat report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Report built (private mode): see the issue in the private report repository." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish report issue
        env:
          DEFAULT_TOKEN: ${{ github.token }}
          THIS_REPO: ${{ github.repository }}
        run: |
          if [ "$PRIVATE_MODE" = "true" ]; then
            export GH_TOKEN="$AUDIT_TOKEN"
            export GH_REPO="$REPORT_REPO"
          else
            export GH_TOKEN="$DEFAULT_TOKEN"
            export GH_REPO="$THIS_REPO"
          fi

          title="Weekly Organization Health Report"
          # Find the previous report by title, not by label: the label may not exist in the
          # target repository yet, and the issue is then created without it.
          existing=$(gh issue list --state open --search "$title in:title" --json number,title \
            --jq '[.[] | select(.title == "Weekly Organization Health Report")][0].number // empty')

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file report.md
          else
            gh issue create --title "$title" --body-file report.md --label health-check \
              || gh issue create --title "$title" --body-file report.md \
              || echo "::warning::Could not create the report issue (are issues enabled on the target repository?)."
          fi
