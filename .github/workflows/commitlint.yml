name: Commitlint

# Validates every commit of a pull request against Conventional Commits.
# Runs on this repository's own PRs and can be called from other repositories.

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_call:

permissions:
  contents: read

jobs:
  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Commitlint
        uses: wagoid/commitlint-github-action@v5
