name: Close stale issues and PRs

# Warns after 30 days of inactivity and closes 7 days later.
# actions/stale only needs `issues` and `pull-requests` write access.

on:
  schedule:
    - cron: "0 0 * * *" # Every day at midnight UTC
  workflow_dispatch:
  workflow_call:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Stale bot
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Run stale bot
        uses: actions/stale@v11
        with:
          days-before-stale: 30
          days-before-close: 7

          stale-issue-label: stale
          stale-pr-label: stale

          stale-issue-message: >
            This issue has had no activity for 30 days and is now marked as stale.
            Comment or remove the `stale` label to keep it open; otherwise it will be closed in 7 days.
          stale-pr-message: >
            This pull request has had no activity for 30 days and is now marked as stale.
            Push a commit or comment to keep it open; otherwise it will be closed in 7 days.

          close-issue-message: Closed due to inactivity. Feel free to reopen it if it is still relevant.
          close-pr-message: Closed due to inactivity. Feel free to reopen it if it is still relevant.

          exempt-issue-labels: pinned,security,blocked
          exempt-pr-labels: pinned,security,blocked

          operations-per-run: 200
          remove-stale-when-updated: true
