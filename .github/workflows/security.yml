name: Reusable Security Scan

# Security suite for any TriNodes repository.
#
#   CodeQL ............ static analysis (public repos, or private with GitHub Advanced Security)
#   Dependency review . blocks PRs that add vulnerable dependencies (same condition as CodeQL)
#   npm audit ......... known vulnerabilities in package-lock.json
#   OSV-Scanner ....... known vulnerabilities from the OSV database
#   Gitleaks .......... secrets in the full git history
#   Sensitive files ... keys, certificates and .env files committed by mistake
#   Workflow perms .... missing or dangerous `permissions` in workflows
#
# Usage (the caller MUST grant these permissions, a called workflow cannot elevate them):
#
#   jobs:
#     security:
#       permissions:
#         contents: read
#         actions: read
#         security-events: write
#         issues: write
#       uses: TriNodes/.github/.github/workflows/security.yml@main
#       with:
#         languages: '["javascript-typescript"]'
#
# Branch-protection auditing is not done here: the workflow token cannot read
# branch-protection settings. It is part of health-check.yml instead.

on:
  workflow_call:
    inputs:
      languages:
        description: JSON array of CodeQL languages (for example '["javascript-typescript"]' or '["actions"]')
        type: string
        default: '["javascript-typescript"]'
      advanced_security:
        description: Set to true when a PRIVATE repository has GitHub Advanced Security (enables CodeQL, dependency review and SARIF upload)
        type: boolean
        default: false
      enable_osv:
        description: Run OSV-Scanner (disable for repositories without any package manifest)
        type: boolean
        default: true
      audit_level:
        description: Minimum npm audit severity that fails the job (low, moderate, high, critical)
        type: string
        default: high

permissions:
  contents: read

jobs:
  meta:
    name: Repository metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code_scanning: ${{ steps.vis.outputs.code_scanning }}
    steps:
      # Code scanning needs GitHub Advanced Security on private repositories.
      - name: Detect whether code scanning is available
        id: vis
        env:
          GH_TOKEN: ${{ github.token }}
          ADVANCED_SECURITY: ${{ inputs.advanced_security }}
        run: |
          private=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .private)
          if [ "$private" = "false" ] || [ "$ADVANCED_SECURITY" = "true" ]; then
            echo "code_scanning=true" >> "$GITHUB_OUTPUT"
          else
            echo "code_scanning=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Private repository without advanced_security: CodeQL, dependency review and SARIF upload are skipped."
          fi

  codeql:
    name: CodeQL (${{ matrix.language }})
    needs: meta
    if: needs.meta.outputs.code_scanning == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  dependency_review:
    name: Dependency review
    needs: meta
    if: github.event_name == 'pull_request' && needs.meta.outputs.code_scanning == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  npm_audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # `npm audit` reads package-lock.json; no install is needed.
      - name: Audit dependencies
        env:
          AUDIT_LEVEL: ${{ inputs.audit_level }}
        run: |
          if [ ! -f package-lock.json ]; then
            echo "No package-lock.json - skipping npm audit." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npm audit --json > audit.json || true
          npm audit --audit-level="$AUDIT_LEVEL"

      - name: Upload audit report
        if: always() && hashFiles('audit.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit
          path: audit.json

  osv:
    name: OSV-Scanner
    needs: meta
    if: inputs.enable_osv
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.6.0
    with:
      upload-sarif: ${{ needs.meta.outputs.code_scanning == 'true' }}
      fail-on-vuln: true

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.30.1
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz, from the official checksums file of the release.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The gitleaks-action needs a paid license for organization repositories, so the
      # open-source CLI is used directly, pinned to a version and verified by checksum.
      - name: Install Gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan history for secrets
        run: ./gitleaks detect --source . --redact --verbose --exit-code 1 --report-format sarif --report-path gitleaks.sarif

      - name: Upload Gitleaks report
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: gitleaks.sarif

  sensitive_files:
    name: Sensitive files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Scan tracked files
        run: |
          # Likely to contain secrets or private keys -> fail.
          blocked=$(git ls-files | grep -E -i '(^|/)(\.env(\.[^/]+)?|[^/]+\.(pem|p12|pfx|key|keystore|jks)|id_(rsa|dsa|ecdsa|ed25519))$' \
            | grep -v -E -i '\.(example|sample|template)$' || true)
          # Usually public, but worth a human look -> warn.
          review=$(git ls-files | grep -E -i '\.(crt|cert|cer)$' || true)

          {
            echo "## Sensitive files"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$review" ]; then
            while IFS= read -r f; do echo "::warning file=$f::Certificate committed - confirm it is public"; done <<< "$review"
            { echo "**Certificates to review**"; echo; sed 's/^/- `/; s/$/`/' <<< "$review"; echo; } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -n "$blocked" ]; then
            while IFS= read -r f; do echo "::error file=$f::Sensitive file committed to the repository"; done <<< "$blocked"
            { echo "**Blocked files**"; echo; sed 's/^/- `/; s/$/`/' <<< "$blocked"; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "No sensitive files found." >> "$GITHUB_STEP_SUMMARY"

  workflow_permissions:
    name: Workflow permissions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Scan workflow permissions
        run: |
          shopt -s nullglob
          status=0
          {
            echo "## Workflow permissions"
            echo
            echo "| Workflow | Finding |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          for wf in .github/workflows/*.yml .github/workflows/*.yaml; do
            if ! grep -Eq '^\s*permissions:' "$wf"; then
              echo "::warning file=$wf::No explicit permissions block (falls back to the repository default)"
              echo "| \`$wf\` | ⚠️ no explicit \`permissions\` |" >> "$GITHUB_STEP_SUMMARY"
            fi
            if grep -Eq 'permissions:\s*write-all' "$wf"; then
              echo "::error file=$wf::write-all grants every permission to the token"
              echo "| \`$wf\` | ❌ \`write-all\` |" >> "$GITHUB_STEP_SUMMARY"
              status=1
            fi
            if grep -Eq '^\s*id-token:\s*write' "$wf"; then
              echo "::notice file=$wf::id-token: write found - document why it is needed"
              echo "| \`$wf\` | ℹ️ \`id-token: write\` (needs justification) |" >> "$GITHUB_STEP_SUMMARY"
            fi
            if grep -Eq '^\s*contents:\s*write' "$wf"; then
              echo "::notice file=$wf::contents: write found - document why it is needed"
              echo "| \`$wf\` | ℹ️ \`contents: write\` (needs justification) |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          exit "$status"

  notify:
    name: Open issue on scheduled failure
    needs: [codeql, dependency_review, npm_audit, osv, gitleaks, sensitive_files, workflow_permissions]
    if: always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Open or update the security issue
        run: |
          title="Scheduled security scan failed"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="The scheduled security scan failed on $(date -u +%F). Review the findings: ${run_url}"

          existing=$(gh issue list --state open --label security --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label security \
              || gh issue create --title "$title" --body "$body"
          fi
