name: PR Title Lint (Flexible)

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          # Permite PRs sem prefixo
          requireScope: false
          requireSubject: false
          requireBody: false
          requireDescription: false

          # Permite prefixos personalizados
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
            # Prefixos extra
            config
            workflow
            meta
            update
            improve

          # Ignora PRs que só mexem em workflows
          ignoreLabels: |
            skip-semantic
            workflows
            ci-only

          # Se o título não seguir o padrão, apenas avisa — não falha
          failOnError: false
