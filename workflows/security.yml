name: Security Scan

on:
  schedule:
    - cron: "0 3 * * *" # Todos os dias às 03:00
  push:
    branches: ["main"]

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    uses: github/codeql-action/.github/workflows/codeql.yml@v3

  secret_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Secret scanning
        uses: github/secret-scanning-action@v1

  dependency_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --json > audit.json || true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: audit.json

  supply_chain_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run OSV scanner
        uses: google/osv-scanner-action@v1
        with:
          scan: "."
          output: "osv-results.json"

      - name: Upload OSV report
        uses: actions/upload-artifact@v4
        with:
          name: osv-scan
          path: osv-results.json

  gitleaks_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --report-format json --report-path gitleaks.json

      - name: Upload Gitleaks report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.json

  security_report:
    runs-on: ubuntu-latest
    needs: [codeql, secret_scan, dependency_scan, supply_chain_scan, gitleaks_scan]

    steps:
      - name: Generate consolidated report
        run: |
          echo "# Security Report" > report.md
          echo "Generated on $(date)" >> report.md
          echo "" >> report.md

          echo "## CodeQL" >> report.md
          echo "- CodeQL scan completed" >> report.md

          echo "## Secret Scanning" >> report.md
          echo "- Secret scanning completed" >> report.md

          echo "## Dependency Audit" >> report.md
          echo "- npm audit report attached" >> report.md

          echo "## Supply Chain (OSV)" >> report.md
          echo "- OSV scan completed" >> report.md

          echo "## Gitleaks" >> report.md
          echo "- Gitleaks scan completed" >> report.md

      - name: Upload consolidated report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: report.md
